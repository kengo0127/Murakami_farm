<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>村上農園 タスク管理 - ログイン</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Meiryo', sans-serif;
      background: linear-gradient(160deg, #e8f5e9 0%, #f1f8e9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 6px 32px rgba(0, 80, 0, 0.10);
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header-icon {
      font-size: 52px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #2e5c28;
      letter-spacing: 0.04em;
    }

    .header p {
      font-size: 13px;
      color: #7a9c76;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #444;
      margin-bottom: 8px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 15px 16px;
      border: 2px solid #dde8dd;
      border-radius: 12px;
      font-size: 16px;
      color: #222;
      background: #fafffe;
      transition: border-color 0.18s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #4caf50;
      background: #fff;
    }

    .btn-login {
      width: 100%;
      padding: 17px;
      background: #2e5c28;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.18s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover { background: #3d7a37; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { background: #aaa; cursor: not-allowed; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      display: none;
      margin-top: 18px;
      padding: 13px 16px;
      background: #fff0f0;
      border: 1.5px solid #ffcccc;
      border-radius: 10px;
      color: #c0392b;
      font-size: 14px;
      line-height: 1.5;
    }

    .error-box.show { display: block; }

    .lang-switch {
      display: flex;
      gap: 6px;
      margin-bottom: 22px;
    }

    .lang-btn {
      flex: 1;
      background: #f5f5f5;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      color: #555;
      cursor: pointer;
    }

    .lang-btn.active {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #1a3d17;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="lang-switch">
      <button type="button" class="lang-btn" data-lang="ja" onclick="setLang('ja')">日本語</button>
      <button type="button" class="lang-btn" data-lang="id" onclick="setLang('id')">Indonesia（インドネシア語）</button>
      <button type="button" class="lang-btn" data-lang="km" onclick="setLang('km')">ខ្មែរ（カンボジア語）</button>
    </div>

    <div class="header">
      <div class="header-icon">🌿</div>
      <h1>村上農園</h1>
      <p id="subtitleText">タスク管理システム</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email" id="emailLabel">メールアドレス</label>
        <input
          type="email"
          id="email"
          placeholder="your@email.com"
          autocomplete="email"
          inputmode="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password" id="passwordLabel">パスワード</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        ログイン
      </button>

      <div class="error-box" id="errorBox"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    // ── 多言語対応（日本語 / インドネシア語 / クメール語） ──
    const LOGIN_I18N = {
      ja: {
        subtitle: 'タスク管理システム', emailLabel: 'メールアドレス', passwordLabel: 'パスワード',
        login: 'ログイン', loggingIn: 'ログイン中...',
        errInvalid: 'メールアドレスまたはパスワードが正しくありません',
        errNotConfirmed: 'メールアドレスの確認が完了していません。確認メールをご確認ください。',
        errTooMany: 'ログイン試行が多すぎます。しばらく時間をおいてから再試行してください。',
        errGeneral: 'ログインに失敗しました。しばらくしてから再試行してください。',
      },
      id: {
        subtitle: 'Sistem Manajemen Tugas', emailLabel: 'Alamat Email', passwordLabel: 'Kata Sandi',
        login: 'Masuk', loggingIn: 'Sedang masuk...',
        errInvalid: 'Alamat email atau kata sandi salah',
        errNotConfirmed: 'Verifikasi email belum selesai. Silakan periksa email konfirmasi Anda.',
        errTooMany: 'Terlalu banyak percobaan masuk. Silakan coba lagi setelah beberapa saat.',
        errGeneral: 'Gagal masuk. Silakan coba lagi nanti.',
      },
      km: {
        subtitle: 'ប្រព័ន្ធគ្រប់គ្រងការងារ', emailLabel: 'អាសយដ្ឋានអ៊ីមែល', passwordLabel: 'ពាក្យសម្ងាត់',
        login: 'ចូល', loggingIn: 'កំពុងចូល...',
        errInvalid: 'អាសយដ្ឋានអ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ',
        errNotConfirmed: 'ការផ្ទៀងផ្ទាត់អ៊ីមែលមិនទាន់បញ្ចប់ទេ។ សូមពិនិត្យអ៊ីមែលបញ្ជាក់របស់អ្នក។',
        errTooMany: 'ការព្យាយាមចូលច្រើនពេក។ សូមព្យាយាមម្ដងទៀតក្នុងពេលបន្តិចទៀត។',
        errGeneral: 'ចូលមិនបានជោគជ័យទេ។ សូមព្យាយាមម្ដងទៀតពេលក្រោយ។',
      },
    };

    let uiLang = localStorage.getItem('staffLang') || 'ja';

    function setLang(lang) {
      uiLang = lang;
      localStorage.setItem('staffLang', lang);
      applyLoginI18n();
    }

    function applyLoginI18n() {
      const d = LOGIN_I18N[uiLang] ?? LOGIN_I18N.ja;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === uiLang));
      document.getElementById('subtitleText').textContent  = d.subtitle;
      document.getElementById('emailLabel').textContent    = d.emailLabel;
      document.getElementById('passwordLabel').textContent = d.passwordLabel;
      document.getElementById('loginBtn').textContent      = d.login;
    }

    applyLoginI18n();

    // すでにログイン済みならリダイレクト（ログアウト直後はスキップし、確実にログイン画面に留まる）
    (async () => {
      if (new URLSearchParams(window.location.search).get('loggedout') === '1') return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) redirectByRole(session.user.id);
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const errorBox = document.getElementById('errorBox');
      const d        = LOGIN_I18N[uiLang] ?? LOGIN_I18N.ja;

      errorBox.classList.remove('show');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span>${d.loggingIn}`;

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await redirectByRole(data.user.id);
      } catch (err) {
        const msg = errorMessage(err.message);
        errorBox.textContent = msg;
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = d.login;
      }
    });

    async function redirectByRole(userId) {
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', userId)
        .single();

      window.location.href = roleHomePage(profile?.role);
    }

    function errorMessage(msg) {
      const d = LOGIN_I18N[uiLang] ?? LOGIN_I18N.ja;
      if (msg.includes('Invalid login credentials')) return d.errInvalid;
      if (msg.includes('Email not confirmed'))        return d.errNotConfirmed;
      if (msg.includes('Too many requests'))           return d.errTooMany;
      return d.errGeneral;
    }
  </script>
</body>
</html>
